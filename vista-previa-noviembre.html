<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista previa · 6 al 13 de noviembre</title><style>
:root{--bg:#f0f2f5;--card:#fff;--ink:#111;--mute:#65676b;--line:#dbdbdb}
body{margin:0;background:var(--bg);font:15px/1.45 system-ui,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#0f1628;color:#f6f5f1;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 auto 0 0}
header button{background:#1d2742;color:#c9cdd8;border:1px solid #2d3a5c;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
header button.on{background:#58e1ff;color:#0f1628;border-color:#58e1ff}
main{max-width:520px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:28px}
.cuando{font:600 13px ui-monospace,monospace;color:#2b4bff;margin-bottom:8px;text-transform:uppercase}
.nota{background:#fff4d6;color:#7a5600;border-radius:6px;padding:1px 8px;margin-left:6px;text-transform:none}
.post{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:36px;height:36px;border-radius:50%;background:#0f1628;color:#58e1ff;display:grid;place-items:center;font:700 11px ui-monospace,monospace}
.top b{display:block;font-size:14px}.top small{color:var(--mute)}
.red{margin-left:auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;color:#fff}
.instagram .red{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}.facebook .red{background:#1877f2}.linkedin .red{background:#0a66c2}
.car{position:relative;aspect-ratio:4/5;background:#000}
.car img{width:100%;height:100%;object-fit:cover;display:block}
.car button{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:18px;cursor:pointer}
.car .p{left:8px}.car .n{right:8px}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.pdf{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:3px 9px;border-radius:6px}
.dots{display:flex;justify-content:center;gap:4px;padding:8px}.dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}.dots i.on{background:#0095f6}
.txt{padding:4px 14px 14px;white-space:pre-wrap;word-wrap:break-word}
.linkedin .txt,.facebook .txt{padding-top:2px;order:-1}
.cuerpo{display:flex;flex-direction:column}
.instagram .txt b{margin-right:6px}
</style></head><body>
<header><h1>Vista previa · 6 al 13 de noviembre</h1><button class="on" data-f="todas">Todas</button><button data-f="instagram">Instagram</button><button data-f="facebook">Facebook</button><button data-f="linkedin">LinkedIn</button></header>
<main id="m"></main>
<script>
const POSTS=[{"cuando": "Vie 6 · 19:00", "redes": ["instagram", "facebook"], "imgs": ["out/reels/reel2.jpg"], "nota": "reel ya editado · sale del borrador", "texto": "Mis automatizaciones no corren en la nube. n8n para los flujos, ListMonk para los correos y Postiz para programar publicaciones, todo autoalojado con Docker en un servidor en mi casa.\n\n¿Qué automatizarías tú si no tuvieras que pagar suscripción? Te leo en los comentarios.\n\nVideo con mi avatar y mi voz clonada con IA.\n\n#n8n #selfhosting #homelab #automatizacion #docker #opensource"}, {"cuando": "Lun 9 · 12:30", "redes": ["linkedin"], "imgs": ["out/09-actualizacion/01.png", "out/09-actualizacion/02.png", "out/09-actualizacion/03.png", "out/09-actualizacion/04.png", "out/09-actualizacion/05.png", "out/09-actualizacion/06.png"], "nota": "documento PDF", "texto": "El viernes actualicé las apps de mi homelab y se reiniciaron 40 contenedores sin que yo lo pidiera.\n\nIba servicio por servicio a propósito: respaldo primero, imagen descargada antes de parar nada, comprobación después de cada cambio y vuelta a la versión anterior si algo fallaba. El reinicio vino del paso que parecía inofensivo. Al actualizar el sistema del contenedor, apt también actualizó Docker, y el servicio se reinició con todo adentro. Los 40 volvieron solos, pero entre ellos había tres Nextcloud que yo hubiera preferido no tocar.\n\nEl trabajo lo ejecutó un agente de IA y las decisiones las tomé yo. Al revisar el respaldo apareció otro fallo: la base de Vaultwarden se había copiado con el servicio encendido, así que se repitió con el servicio parado.\n\nMi nota para la próxima es mirar si Docker está en la lista de paquetes antes de actualizar. ¿Tú separas esa actualización del resto del sistema?\n\n#homelab #docker #devops #selfhosting"}, {"cuando": "Lun 9 · 19:00", "redes": ["instagram", "facebook"], "imgs": ["out/09-actualizacion/01.png", "out/09-actualizacion/02.png", "out/09-actualizacion/03.png", "out/09-actualizacion/04.png", "out/09-actualizacion/05.png", "out/09-actualizacion/06.png"], "nota": "", "texto": "Iba con cuidado, servicio por servicio, y aun así se reiniciaron 40 contenedores. Actualizar el sistema también actualizó Docker. Todos volvieron solos, pero el susto me dejó tres cambios para la próxima.\n\nEn el carrusel está el método completo y los dos fallos. Lo ejecutó un agente de IA y las decisiones fueron mías.\n\n¿Vas servicio por servicio o lo lanzas todo de una?\n\n#homelab #docker #selfhosting #linux #devops"}, {"cuando": "Mar 10 · 12:30", "redes": ["linkedin"], "imgs": ["assets/logo-a.png"], "nota": "solo texto", "texto": "Mi tablero marcaba en rojo un DNS que funcionaba perfectamente.\n\nEra el DNS público de respaldo de mi red. La prueba abría una conexión TCP al puerto 53 y en 24 horas falló 69 veces, siempre un muestreo suelto. Bastaba un fallo para pintar la tarjeta de rojo, así que el tablero avisaba de una caída que nadie podía notar.\n\nHice dos cambios. La prueba ahora hace una consulta DNS real por UDP, igual que un cliente. Y la tarjeta solo se pone roja si falla el minuto completo, con max_over_time sobre probe_success en Prometheus.\n\nUn monitor que avisa sin motivo termina ignorado, y ahí es cuando una caída real pasa de largo. Por eso reviso las alertas falsas con la misma seriedad que las verdaderas.\n\n#prometheus #grafana #homelab #observabilidad"}, {"cuando": "Mié 11 · 12:30", "redes": ["linkedin"], "imgs": ["out/10-note9/01.png", "out/10-note9/02.png", "out/10-note9/03.png", "out/10-note9/04.png", "out/10-note9/05.png", "out/10-note9/06.png"], "nota": "documento PDF · falta confirmar UPS", "texto": "Un Galaxy Note 9 vigila mis servidores.\n\nCada minuto comprueba 28 servicios y me avisa por Telegram a la segunda falla. Cuando se va la luz, su batería lo mantiene despierto: si pasa 120 segundos sin cargar, apaga los servidores uno detrás del otro por SSH. Los cortes cortos no cuentan.\n\nLo que más cuidé fue la clave. Solo puede ejecutar un script, y ese script solo acepta dos órdenes: prueba y apagar. No sirve para abrir una consola en el servidor.\n\nLa orden de prueba responde en los dos servidores. Todavía me falta verlo funcionar en un corte real, así que acepto ideas de lo que le agregarías.\n\n#homelab #linux #ssh #selfhosting"}, {"cuando": "Mié 11 · 19:00", "redes": ["instagram", "facebook"], "imgs": ["out/10-note9/01.png", "out/10-note9/02.png", "out/10-note9/03.png", "out/10-note9/04.png", "out/10-note9/05.png", "out/10-note9/06.png"], "nota": "falta confirmar UPS", "texto": "Le di trabajo a un Note 9: vigila 28 servicios cada minuto y, si se va la luz, apaga mis servidores en orden.\n\nLa clave que usa solo sabe hacer eso. Todavía me falta probarlo en un corte real. ¿Qué le agregarías?\n\n#homelab #selfhosting #android #termux #linux"}, {"cuando": "Jue 12 · 19:00", "redes": ["instagram", "facebook"], "imgs": ["out/reels/reel1.jpg"], "nota": "reel ya editado · texto ajustado", "texto": "No necesitas una 4090 para tener IA en casa. Lo medí en una RX 580 de 8 GB del 2017: 99 tokens por segundo en el modelo más rápido y 21 en uno de 30B.\n\nComenta RX580 y te paso el repositorio con todos los benchmarks.\n\nVideo con mi avatar y mi voz clonada con IA.\n\n#ialocal #inteligenciaartificial #homelab #amd #llamacpp #opensource"}, {"cuando": "Vie 13 · 19:00", "redes": ["instagram", "facebook", "linkedin"], "imgs": ["out/reels/reel3.jpg"], "nota": "reel ya editado · se mueve del lun 9", "texto": "Un solo error de permisos puede mostrarle a un cliente los datos de todos los demás. Por eso Forja, mi app para entrenadores personales, tiene 109 pruebas solo de permisos, sobre Supabase con seguridad por fila.\n\nCuando construyo algo para un cliente, empiezo por aquí.\n\nVideo con mi avatar y mi voz clonada con IA.\n\n#supabase #ciberseguridad #react #testing #desarrolloweb"}];
const NOM={instagram:'avilacarlosdev',facebook:'Avila Carlos Dev',linkedin:'Carlos Avila'};
const m=document.getElementById('m');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(f){m.innerHTML='';POSTS.forEach(p=>p.redes.forEach(r=>{if(f!=='todas'&&f!==r)return;
 const w=document.createElement('section');let i=0;
 w.innerHTML=`<div class="cuando">${p.cuando}${p.nota&&!(p.nota==='documento PDF'&&r!=='linkedin')?'<span class="nota">'+p.nota+'</span>':''}</div>
 <div class="post ${r}"><div class="top"><div class="av">&lt;CA/&gt;</div><div><b>${NOM[r]}</b><small>${r==='linkedin'?'Full Stack Developer · IA':'Venezuela'}</small></div><span class="red">${r}</span></div>
 <div class="cuerpo"><div class="car"><img><span class="cnt"></span>${p.nota==='documento PDF'?'<span class="pdf">PDF · '+p.imgs.length+' páginas</span>':''}${p.imgs.length>1?'<button class="p">‹</button><button class="n">›</button>':''}</div>
 ${p.imgs.length>1?'<div class="dots">'+p.imgs.map(()=>'<i></i>').join('')+'</div>':''}
 <div class="txt">${r==='instagram'?'<b>avilacarlosdev</b>':''}${esc(p.texto)}</div></div></div>`;
 const img=w.querySelector('img'),cnt=w.querySelector('.cnt'),dots=w.querySelectorAll('.dots i');
 const show=()=>{img.src=p.imgs[i];cnt.textContent=(i+1)+'/'+p.imgs.length;dots.forEach((d,k)=>d.classList.toggle('on',k===i))};
 w.querySelector('.p')?.addEventListener('click',()=>{i=(i-1+p.imgs.length)%p.imgs.length;show()});
 w.querySelector('.n')?.addEventListener('click',()=>{i=(i+1)%p.imgs.length;show()});
 show();m.appendChild(w)}))}
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{document.querySelectorAll('header button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.f)});
render('todas');
</script></body></html>
