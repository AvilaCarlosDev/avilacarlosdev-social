<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista previa · semana 1</title><style>
:root{--bg:#f0f2f5;--card:#fff;--ink:#111;--mute:#65676b;--line:#dbdbdb}
body{margin:0;background:var(--bg);font:15px/1.45 system-ui,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#0f1628;color:#f6f5f1;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 auto 0 0}
header button{background:#1d2742;color:#c9cdd8;border:1px solid #2d3a5c;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
header button.on{background:#58e1ff;color:#0f1628;border-color:#58e1ff}
main{max-width:520px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:28px}
.cuando{font:600 13px ui-monospace,monospace;color:#2b4bff;margin-bottom:8px;text-transform:uppercase}
.nota{background:#fff4d6;color:#7a5600;border-radius:6px;padding:1px 8px;margin-left:6px;text-transform:none}
.post{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:36px;height:36px;border-radius:50%;background:#0f1628;color:#58e1ff;display:grid;place-items:center;font:700 11px ui-monospace,monospace}
.top b{display:block;font-size:14px}.top small{color:var(--mute)}
.red{margin-left:auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;color:#fff}
.instagram .red{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}.facebook .red{background:#1877f2}.linkedin .red{background:#0a66c2}
.car{position:relative;aspect-ratio:4/5;background:#000}
.car img{width:100%;height:100%;object-fit:cover;display:block}
.car button{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:18px;cursor:pointer}
.car .p{left:8px}.car .n{right:8px}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.pdf{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:3px 9px;border-radius:6px}
.dots{display:flex;justify-content:center;gap:4px;padding:8px}.dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}.dots i.on{background:#0095f6}
.txt{padding:4px 14px 14px;white-space:pre-wrap;word-wrap:break-word}
.linkedin .txt,.facebook .txt{padding-top:2px;order:-1}
.cuerpo{display:flex;flex-direction:column}
.instagram .txt b{margin-right:6px}
</style></head><body>
<header><h1>Vista previa · semana 1</h1><button class="on" data-f="todas">Todas</button><button data-f="instagram">Instagram</button><button data-f="facebook">Facebook</button><button data-f="linkedin">LinkedIn</button></header>
<main id="m"></main>
<script>
const POSTS=[{"cuando": "Hoy sáb 24 · 19:00", "redes": ["instagram", "facebook"], "imgs": ["out/01-presentacion/01.png", "out/01-presentacion/02.png", "out/01-presentacion/03.png", "out/01-presentacion/04.png", "out/01-presentacion/05.png"], "texto": "Soy Carlos, developer en Punto Fijo, y hago webs para negocios que quieren recibir pedidos, reservas y cotizaciones por WhatsApp.\n\nCada web trae el botón de WhatsApp con el mensaje ya escrito, un formulario que guarda cada contacto y te avisa por correo, y la medición de tus anuncios de Meta para que sepas cuál te trae clientes.\n\nTambién hago apps que se instalan en el teléfono, como Forja, la app que hice para entrenadores personales.\n\n¿Tienes un negocio? Escríbeme al WhatsApp +1 346 491 9344 y cuéntame qué vendes. Te digo qué haría.\n\n#desarrolloweb #paginasweb #puntofijo #falcon #venezuela #emprendedores #whatsappbusiness", "nota": "propuesto: se adelanta a hoy"}, {"cuando": "Lun 26 · 12:30", "redes": ["linkedin"], "imgs": ["out/01-presentacion/01.png"], "texto": "Mi trabajo se enfoca en dos cosas: webs que traen clientes a negocios pequeños y apps en producción con pruebas de verdad.\n\nLas webs las pienso al revés de como se suelen hacer. Primero defino cómo llega el cliente a WhatsApp, dónde queda guardado su contacto y cómo el dueño sabe qué anuncio lo trajo. El diseño viene después.\n\nLas apps las llevo de la idea a producción. Forja, mi app para entrenadores personales, tiene 160 pruebas automáticas y 109 de ellas revisan permisos, porque un coach nunca debe ver los clientes de otro.\n\nTrabajo con React, Node.js, TypeScript y Supabase, desde Venezuela y en remoto.\n\nSi buscas un developer para tu equipo o tienes un negocio que necesita su web, escríbeme. Proyectos y CV en avilacarlosdev.com", "nota": ""}, {"cuando": "Mar 27 · 12:30", "redes": ["linkedin", "facebook"], "imgs": ["out/05-forja/01.png"], "texto": "Forja tiene 160 pruebas automáticas. 109 de ellas existen para comprobar una sola regla: cada persona ve solo sus propios datos.\n\nEn una app para entrenadores personales eso importa mucho. El coach carga peso, grasa corporal, medidas y cobros de sus clientes. Si un cliente cambia de entrenador, su historial lo acompaña, pero el entrenador anterior deja de verlo.\n\nTodo eso vive en Supabase con seguridad por fila (RLS). Cada política tiene pruebas que intentan leer y escribir lo que no deberían, y fallan si lo consiguen.\n\nHoy Forja está en producción: rutinas con la animación de cada ejercicio, dieta, evolución en gráficas y finanzas del coach. Se instala en el teléfono como una app.\n\nSe puede probar en forja-trainer.vercel.app\n\n#react #supabase #testing #desarrolloweb", "nota": ""}, {"cuando": "Mié 28 · 12:30", "redes": ["linkedin"], "imgs": ["out/02-errores/01.png", "out/02-errores/02.png", "out/02-errores/03.png", "out/02-errores/04.png", "out/02-errores/05.png", "out/02-errores/06.png", "out/02-errores/07.png"], "texto": "Cuando un dueño de negocio me dice que su web \"no sirve\", casi nunca es el diseño. En la mayoría de los casos el cliente quiso escribir y algo se lo impidió.\n\nJunté las cinco fallas que más veo, con lo que hago en cada una. Están en el documento.\n\n¿Cuál ves más seguido en las webs de tus clientes o de tu empresa?", "nota": "documento PDF"}, {"cuando": "Mié 28 · 19:00", "redes": ["instagram", "facebook"], "imgs": ["out/02-errores/01.png", "out/02-errores/02.png", "out/02-errores/03.png", "out/02-errores/04.png", "out/02-errores/05.png", "out/02-errores/06.png", "out/02-errores/07.png"], "texto": "Revisa tu web con esta lista. Si encuentras dos o más, estás perdiendo mensajes de clientes.\n\n1. No encuentran cómo escribirte\n2. El formulario llega a un correo que nadie revisa\n3. Tarda en abrir en el teléfono\n4. Pagas anuncios sin saber cuál funciona\n5. El formulario se llena de spam\n\nGuárdalo para revisarlo con calma. Y si quieres una segunda opinión, mándame el link de tu web por WhatsApp (+1 346 491 9344) y te digo qué cambiaría.\n\n#paginasweb #marketingdigital #emprendedores #pymes #whatsappbusiness #venezuela", "nota": ""}, {"cuando": "Jue 29 · 19:00", "redes": ["instagram", "facebook"], "imgs": ["out/03-demos/01.png", "out/03-demos/02.png", "out/03-demos/03.png", "out/03-demos/04.png", "out/03-demos/05.png", "out/03-demos/06.png", "out/03-demos/07.png", "out/03-demos/08.png"], "texto": "Hice una web de ejemplo para seis rubros: barbería, delivery, ferretería, floristería, tienda deportiva y taxi.\n\nTodas tienen algo en común: el cliente termina escribiéndote por WhatsApp con su pedido, su reserva o su cotización ya armada.\n\nPuedes recorrerlas todas en avilacarlosdev.com (link en la bio). ¿Cuál se parece más a tu negocio? Dímelo en los comentarios.\n\n#paginasweb #barberia #delivery #ferreteria #floristeria #emprendedores #puntofijo", "nota": ""}, {"cuando": "Vie 30 · 12:30", "redes": ["linkedin"], "imgs": ["out/04-caso-dr-eddy/01.png", "out/04-caso-dr-eddy/02.png", "out/04-caso-dr-eddy/03.png", "out/04-caso-dr-eddy/04.png", "out/04-caso-dr-eddy/05.png"], "texto": "Estoy migrando la web de un cirujano bariátrico de WordPress a React. El requisito principal no tenía que ver con el diseño: recibir pacientes por WhatsApp sin publicar el número.\n\nLa solución fue poner un formulario corto antes de WhatsApp. El contacto se guarda en la base de datos, el doctor recibe un aviso por correo y después se abre WhatsApp con el mensaje armado. Así el número no queda en el HTML para los bots, cada paciente llega con contexto y la página de gracias permite medir qué anuncio de Meta lo trajo.\n\nDetalles del flujo en el documento.", "nota": "documento PDF"}, {"cuando": "Vie 30 · 19:00", "redes": ["instagram", "facebook"], "imgs": ["out/04-caso-dr-eddy/01.png", "out/04-caso-dr-eddy/02.png", "out/04-caso-dr-eddy/03.png", "out/04-caso-dr-eddy/04.png", "out/04-caso-dr-eddy/05.png"], "texto": "Estoy pasando la web del Dr. Eddy Hernández, cirujano bariátrico en Punto Fijo, de WordPress a React.\n\nEl reto era recibir pacientes por WhatsApp sin dejar el número expuesto en la página. Quedó así: el paciente llena un formulario corto, su contacto se guarda, al doctor le llega un aviso por correo y se abre WhatsApp con el mensaje listo.\n\nEste mismo flujo sirve para consultorios, abogados, talleres o cualquier negocio que agenda citas. Si es tu caso, escríbeme al +1 346 491 9344.\n\n#paginasweb #medicos #consultorio #puntofijo #falcon #whatsappbusiness", "nota": ""}];
const NOM={instagram:'avilacarlosdev',facebook:'Avila Carlos Dev',linkedin:'Carlos Avila'};
const m=document.getElementById('m');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(f){m.innerHTML='';POSTS.forEach(p=>p.redes.forEach(r=>{if(f!=='todas'&&f!==r)return;
 const w=document.createElement('section');let i=0;
 w.innerHTML=`<div class="cuando">${p.cuando}${p.nota&&!(p.nota==='documento PDF'&&r!=='linkedin')?'<span class="nota">'+p.nota+'</span>':''}</div>
 <div class="post ${r}"><div class="top"><div class="av">&lt;CA/&gt;</div><div><b>${NOM[r]}</b><small>${r==='linkedin'?'Full Stack Developer · IA':'Punto Fijo, Venezuela'}</small></div><span class="red">${r}</span></div>
 <div class="cuerpo"><div class="car"><img><span class="cnt"></span>${p.nota==='documento PDF'?'<span class="pdf">PDF · '+p.imgs.length+' páginas</span>':''}${p.imgs.length>1?'<button class="p">‹</button><button class="n">›</button>':''}</div>
 ${p.imgs.length>1?'<div class="dots">'+p.imgs.map(()=>'<i></i>').join('')+'</div>':''}
 <div class="txt">${r==='instagram'?'<b>avilacarlosdev</b>':''}${esc(p.texto)}</div></div></div>`;
 const img=w.querySelector('img'),cnt=w.querySelector('.cnt'),dots=w.querySelectorAll('.dots i');
 const show=()=>{img.src=p.imgs[i];cnt.textContent=(i+1)+'/'+p.imgs.length;dots.forEach((d,k)=>d.classList.toggle('on',k===i))};
 w.querySelector('.p')?.addEventListener('click',()=>{i=(i-1+p.imgs.length)%p.imgs.length;show()});
 w.querySelector('.n')?.addEventListener('click',()=>{i=(i+1)%p.imgs.length;show()});
 show();m.appendChild(w)}))}
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>{document.querySelectorAll('header button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.f)});
render('todas');
</script></body></html>
